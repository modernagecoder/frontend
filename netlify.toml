# Netlify Configuration for Frontend

[build]
  # Generate blog and course content before deployment.
  #
  # pricing:apply now sits INSIDE generate:all, between the HTML generators and
  # everything that derives from their output. Order matters and got this wrong
  # once: generate:static-md builds the .md files AI crawlers read straight from
  # the HTML, so running it before the prices were stamped published 132 twins
  # carrying the retired $40/$100/$150 figures.
  #
  #   generate:html    blogs, courses, resources
  #   build:mesh       the "Keep exploring" internal-link block on every page (needs
  #                    the generated pages to exist; must run before derived so the
  #                    .md twins and llms-full.txt carry the same links)
  #   pricing:apply    stamp every price
  #   generate:derived .md twins, llms.txt, sitemaps
  #
  # pricing:verify then fails the build if any page shows a different price from
  # the one it publishes to Google — the fault that was live on the homepage
  # before this system existed.
  #
  # pricing:refresh is deliberately NOT here. It pulls live World Bank and
  # exchange-rate data, and running it on every deploy would let prices move
  # without anyone reviewing the change. It is a manual command; the committed
  # data files are what deploys.
  command = "npm install && npm run generate:all && npm run pricing:verify && npm run build:inline && npm run minify && cd lovewall && npm install && npm run build && cd .."
  publish = "."
  functions = "api"

# IndexNow auto-ping. Deliberately a plugin and NOT part of the build command above:
# the build command runs BEFORE the deploy is published, so pinging there would send
# search engines to crawl URLs that are not live yet (a new page would be fetched as a
# 404). This plugin uses onSuccess, which Netlify runs only AFTER the deploy is live and
# which cannot fail a build or deploy. It submits only URLs changed since the previous
# successful deploy, production context only, and never bulk-submits.
[[plugins]]
  package = "./plugins/indexnow"

# API Function redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

