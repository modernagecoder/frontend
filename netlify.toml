# Security headers
# No X-Robots-Tag here on purpose: "index, follow" is already the default, so the header
# added nothing — but /*.md matches this rule too, so it sent markdown twins a second,
# contradictory X-Robots-Tag alongside their "noindex" one. Omitting it leaves the twins
# with exactly one directive and leaves HTML pages indexable exactly as before.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Signal = "ai-train=yes, search=yes, ai-input=yes"

# Markdown twins for AI agents — text/markdown content type. Kept out of
# search index to avoid duplicate-content signals against the canonical HTML.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Content-Signal = "ai-train=yes, search=yes, ai-input=yes"
    Cache-Control = "public, max-age=3600"
    Vary = "Accept"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Sitemap stylesheet — must be served with an XML/XSL content type so the
# browser applies it to /sitemap.xml (the global nosniff header forbids sniffing).
[[headers]]
  for = "/sitemap.xsl"
  [headers.values]
    Content-Type = "text/xsl; charset=utf-8"
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "public, max-age=3600"

# Cache static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

