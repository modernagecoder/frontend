<body class="dashboard-page">
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <!-- The logo links back to the public site, which is where people
                 expect a masthead to take them -->
            <a class="logo" href="/" title="Back to the website">
                <img src="/images/logo.svg" alt="Modern Age Coders" class="logo-img" width="34" height="34">
                <span class="logo-text">Modern Age Coders</span>
            </a>
        </div>

        <div class="header-right">
            <!-- Explicit exit as well as the logo, since the logo as a link is
                 a convention not everyone knows -->
            <a class="site-link" href="/" target="_blank" rel="noopener" aria-label="View the website in a new tab" title="View the website">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>

            </a>
            <div class="admin-info">
                <span class="admin-name" id="adminName">Admin</span>
                <span class="admin-email" id="adminEmail"></span>
            </div>
            <button class="btn btn-secondary btn-sm" id="logoutButton">Sign out</button>
        </div>
    </header>

                    </span>
                    <span class="nav-text">Today</span>
                    <span class="nav-count" id="navCountToday" hidden></span>
                </a>

                <div class="nav-section-label">Leads</div>

                <a href="#" class="nav-item" data-page="contacts">
                    <span class="nav-icon">

                    </span>
                    <span class="nav-text">Enquiries</span>
                </a>

                    <span class="nav-text">Callbacks</span>

                    <span class="nav-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 4-9 4-9-4 9-4z"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
                    </span>
                    <span class="nav-text">Corporate</span>
                </a>

                <a href="#" class="nav-item" data-page="business-solutions">
                    <span class="nav-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v11H3z"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>

                    </span>
                    <span class="nav-text">Lead sources</span>
                </a>

                    <span class="nav-icon">

                    <span class="nav-icon">

                    </span>
                    <span class="nav-text">Students</span>

                    <span class="nav-icon">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>
                    </span>
                    <span class="nav-text">Team</span>
