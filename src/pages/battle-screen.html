<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="alternate" type="text/markdown" href="/src/pages/battle-screen.md" title="Markdown version for AI agents">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Arena: Live Screen</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07030f">
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/battle.css?v=4">

<style>
  /* Everything scales from one viewport-derived unit, so the same page is
     legible on a laptop and from the back row of a classroom. */
  :root { --u: clamp(14px, 1.05vw, 26px); }

  body { overflow: hidden; }

  .screen { height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
            gap: calc(var(--u) * .9); padding: calc(var(--u) * 1.1); }

  /* ---- header band ------------------------------------------------------ */
  .band { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
          gap: calc(var(--u) * 1.2); }
  .band-l { min-width: 0; }
  .band-r { display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--u) * .8); }

  .ev-title { font-family: var(--disp); font-weight: 800; font-size: calc(var(--u) * 1.9);
              line-height: 1.05; letter-spacing: -0.02em; }
  .ev-round { font-family: var(--mono); font-size: calc(var(--u) * .72);
              letter-spacing: 0.28em; text-transform: uppercase; color: var(--cyan-hi);
              margin-bottom: calc(var(--u) * .25); }

  .joincode { text-align: right; }
  .joincode small { display: block; font-family: var(--mono); font-size: calc(var(--u) * .58);
                    letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); }
  .joincode strong { font-family: var(--mono); font-weight: 700; font-size: calc(var(--u) * 2);
                     letter-spacing: 0.14em; color: var(--acid); }

  /* ---- body ------------------------------------------------------------- */
  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: calc(var(--u) * .9); min-height: 0; }
  .col { min-height: 0; display: flex; flex-direction: column; }

  .sect-head { display: flex; align-items: baseline; justify-content: space-between;
               margin-bottom: calc(var(--u) * .6); }
  .sect-title { font-family: var(--mono); font-size: calc(var(--u) * .62);
                letter-spacing: 0.26em; text-transform: uppercase; color: var(--faint); }

  /* ---- leaderboard ------------------------------------------------------ */
  .board { flex: 1; overflow: hidden; display: flex; flex-direction: column;
           gap: calc(var(--u) * .3); }
  .brow { display: grid; grid-template-columns: calc(var(--u) * 2.2) calc(var(--u) * 2) 1fr auto;
          align-items: center; gap: calc(var(--u) * .6);
          padding: calc(var(--u) * .42) calc(var(--u) * .6);
          border-radius: calc(var(--u) * .6); border: 1px solid transparent;
          transition: transform .5s cubic-bezier(.2,.9,.3,1), background .5s ease; }
  .brow:nth-child(1) { background: rgba(255,210,74,.1); border-color: rgba(255,210,74,.32); }
  .brow:nth-child(2) { background: rgba(168,133,247,.08); border-color: var(--line); }
  .brow:nth-child(3) { background: rgba(168,133,247,.05); border-color: var(--line); }

  .brank { font-family: var(--mono); font-weight: 700; font-size: calc(var(--u) * .95); color: var(--faint); }
  .brow:nth-child(1) .brank { color: var(--gold); }
  .bname { font-family: var(--disp); font-weight: 700; font-size: calc(var(--u) * .95);
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bpts { font-family: var(--mono); font-weight: 700; font-size: calc(var(--u) * 1.05); color: var(--cyan-hi); }
  .brow .av { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); font-size: calc(var(--u) * .62); }

  /* ---- pulse grid ------------------------------------------------------- */
  .pulse { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 6.5), 1fr));
           gap: calc(var(--u) * .4); align-content: start; overflow: hidden; flex: 1; }
  .tile { display: flex; align-items: center; gap: calc(var(--u) * .4);
          padding: calc(var(--u) * .4) calc(var(--u) * .5);
          border-radius: calc(var(--u) * .55); border: 1px solid var(--line);
          background: rgba(20,12,38,.5); transition: all .45s ease; min-width: 0; }
  .tile .av { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); font-size: calc(var(--u) * .5); }
  .tile span { font-size: calc(var(--u) * .62); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .tile.offline { opacity: .35; }
  .tile.draft     { border-color: rgba(255,210,74,.4); }
  .tile.submitted { border-color: rgba(45,212,191,.55); background: rgba(45,212,191,.12); }
  .tile.correct   { border-color: var(--acid); background: rgba(196,248,42,.16);
                    box-shadow: 0 0 calc(var(--u) * .8) rgba(196,248,42,.28); }
  .tile.wrong     { border-color: rgba(255,45,142,.45); background: rgba(255,45,142,.1); }

  /* ---- debate spotlight ------------------------------------------------- */
  .spot-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: calc(var(--u) * .6);
             align-items: center; margin-bottom: calc(var(--u) * .6); }
  .spot-side { padding: calc(var(--u) * .5); border-radius: calc(var(--u) * .5);
               border: 1px solid var(--line); text-align: center; }
  .spot-side.on { border-color: var(--acid); background: rgba(196,248,42,.09); }
  .spot-side b { display: block; font-family: var(--disp); font-size: calc(var(--u) * .9); }
  .spot-side small { font-family: var(--mono); font-size: calc(var(--u) * .5);
                     letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .spot-quote { font-size: calc(var(--u) * .72); line-height: 1.5; color: var(--mut);
                border-left: 2px solid var(--line2); padding-left: calc(var(--u) * .6); }

  /* ---- footer ----------------------------------------------------------- */
  .foot { display: flex; align-items: center; gap: calc(var(--u) * .8);
          font-family: var(--mono); font-size: calc(var(--u) * .6); color: var(--faint); }

  /* ---- celebration ------------------------------------------------------ */
  .cheer { position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
           z-index: 300; text-align: center; pointer-events: none;
           animation: cheer 2.6s ease forwards; }
  @keyframes cheer {
    0%   { opacity: 0; transform: translateX(-50%) scale(.7) }
    14%  { opacity: 1; transform: translateX(-50%) scale(1.05) }
    24%  { transform: translateX(-50%) scale(1) }
    78%  { opacity: 1 }
    100% { opacity: 0; transform: translateX(-50%) translateY(calc(var(--u) * -1.6)) scale(.95) }
  }
  .cheer b { font-family: var(--disp); font-weight: 800; font-size: calc(var(--u) * 2.2);
             display: block; color: var(--acid); text-shadow: 0 0 calc(var(--u)) rgba(196,248,42,.5); }
  .cheer small { font-family: var(--mono); font-size: calc(var(--u) * .7); color: var(--ink); }

  .center-note { display: grid; place-items: center; height: 100%; text-align: center; }

  /* ---- streaks, rank changes, final-30 ---------------------------------- */
  .streak { font-family: var(--mono); font-size: calc(var(--u) * .58); color: var(--acid);
            white-space: nowrap; }

  .ticker { position: fixed; left: 50%; bottom: calc(var(--u) * 2); transform: translateX(-50%);
            z-index: 250; display: flex; flex-direction: column; gap: calc(var(--u) * .35);
            align-items: center; pointer-events: none; }
  .tick-item { font-family: var(--disp); font-weight: 700; font-size: calc(var(--u) * .9);
               padding: calc(var(--u) * .4) calc(var(--u) * .9);
               border-radius: 999px; border: 1px solid var(--line2);
               background: rgba(20,12,38,.9); backdrop-filter: blur(10px);
               animation: tickin 4s ease forwards; white-space: nowrap; }
  .tick-item b { color: var(--acid); }
  @keyframes tickin {
    0%   { opacity: 0; transform: translateY(calc(var(--u) * .8)) }
    10%  { opacity: 1; transform: translateY(0) }
    85%  { opacity: 1 }
    100% { opacity: 0; transform: translateY(calc(var(--u) * -.5)) }
  }

  /* The last thirty seconds. Deliberately loud. It is the one moment the
     whole room should feel at the same time. */
  .final30 { position: fixed; inset: 0; z-index: 240; pointer-events: none;
             box-shadow: inset 0 0 calc(var(--u) * 6) rgba(255,45,142,.45);
             animation: final 1s ease-in-out infinite; }
  @keyframes final { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

  /* ---- round 2 team grid ------------------------------------------------- */
  .teamgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--u)*9), 1fr));
              gap: calc(var(--u)*.45); align-content: start; }
  .teamcard { padding: calc(var(--u)*.5) calc(var(--u)*.6); border-radius: calc(var(--u)*.55);
              border: 1px solid var(--line); background: rgba(20,12,38,.5); min-width: 0; }
  .teamcard.live { border-color: rgba(196,248,42,.4); background: rgba(196,248,42,.06); }
  .teamcard-top { display: flex; justify-content: space-between; align-items: baseline;
                  gap: calc(var(--u)*.4); margin-bottom: calc(var(--u)*.25); }
  .teamcard-top b { font-family: var(--disp); font-size: calc(var(--u)*.78); }
  .teamcard-top span { font-family: var(--mono); font-size: calc(var(--u)*.58); color: var(--acid); }
  .teamcard-topic { font-size: calc(var(--u)*.55); color: var(--faint); line-height: 1.35;
                    margin-bottom: calc(var(--u)*.35); overflow: hidden;
                    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .teamcard-mates { display: flex; flex-wrap: wrap; gap: calc(var(--u)*.22); }
  .mate { font-family: var(--mono); font-size: calc(var(--u)*.5); padding: 1px calc(var(--u)*.28);
          border-radius: 999px; border: 1px solid var(--line); color: var(--mut); }
  .mate.for { border-color: rgba(45,212,191,.45); color: var(--cyan-hi); }
  .mate.against { border-color: rgba(255,45,142,.45); color: #ff8bbd; }

  /* ---- revealed audience vote ------------------------------------------- */
  .reveal { margin-top: calc(var(--u) * .6); }
  .reveal-bar { display: flex; height: calc(var(--u) * .55); border-radius: 999px;
                overflow: hidden; background: rgba(168,133,247,.14); }
  .reveal-bar i { display: block; height: 100% }
  .reveal-bar i.a { background: var(--cyan) } .reveal-bar i.b { background: var(--pink) }
  .reveal-row { display: flex; justify-content: space-between;
                font-family: var(--mono); font-size: calc(var(--u) * .55);
                color: var(--faint); margin-top: calc(var(--u) * .2); }

  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="atmos"></div>

<!-- Asks for a code when the page is opened bare. -->
<section id="gate" class="shell" style="min-height:100vh;display:grid;place-items:center;padding:1.2rem">
  <form class="card" id="gate-form" style="max-width:420px;width:100%">
    <p class="kicker" style="text-align:center;margin-bottom:.5rem">Projector view</p>
    <h1 style="text-align:center;font-size:1.6rem;margin-bottom:1.2rem">Battle <span class="grad">Screen</span></h1>
    <label class="lbl" for="g-code">Battle code</label>
    <input class="field mono" id="g-code" maxlength="10" autocomplete="off"
           style="text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:1.3rem"
           placeholder="ABC123">
    <button class="btn btn-primary btn-block" style="margin-top:1rem" type="submit">Show the room</button>
    <p class="faint" style="font-size:.78rem;text-align:center;margin-top:.9rem">
      Cast this tab to the TV, or share it on the call.</p>
  </form>
</section>

<main id="screen" class="screen shell hidden">
  <header class="band">
    <div class="band-l">
      <div class="ev-round" id="s-round">Lobby</div>
      <div class="ev-title" id="s-title">Battle Arena</div>
    </div>
    <div id="s-timer"></div>
    <div class="band-r">
      <div class="joincode">
        <small>Join at learn.modernagecoders.com/battle</small>
        <strong id="s-code">,, , , , , </strong>
      </div>
    </div>
  </header>

  <section class="cols">
    <div class="col card" style="padding:calc(var(--u)*.9)">
      <div class="sect-head">
        <span class="sect-title">Leaderboard</span>
        <span class="sect-title" id="s-lb-note"></span>
      </div>
      <div class="board" id="s-board"></div>
    </div>

    <div class="col card" style="padding:calc(var(--u)*.9)">
      <div class="sect-head">
        <span class="sect-title" id="s-right-title">Who has submitted</span>
        <span class="sect-title" id="s-submitted"></span>
      </div>
      <div id="s-right" style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column"></div>
    </div>
  </section>

  <footer class="foot">
    <span id="s-status">Waiting</span>
    <span class="grow"></span>
    <span id="s-announce" style="color:var(--gold)"></span>
  </footer>
</main>

<div class="ticker" id="ticker"></div>
<div class="final30 hidden" id="final30"></div>

<script src="/js/battle-client.js?v=4"></script>
<script>
(function () {
  'use strict';

  var B = window.Battle;
  var $ = function (id) { return document.getElementById(id); };
  var esc = B.escapeHtml;

  var state = {
    code: null, data: null, timer: null,
    seenMarks: {}, seenCue: null,
    lastBoard: null      // previous leaderboard, for detecting overtakes
  };

  var params = new URLSearchParams(location.search);
  if (params.get('code')) $('g-code').value = params.get('code').toUpperCase();

  $('gate-form').addEventListener('submit', function (event) {
    event.preventDefault();
    var code = $('g-code').value.trim().toUpperCase();
    if (code) begin(code);
  });

  // ?code= in the URL means the host can bookmark the projector view.
  if (params.get('code')) begin(params.get('code').toUpperCase());

  function begin(code) {
    state.code = code;
    $('gate').classList.add('hidden');
    $('screen').classList.remove('hidden');
    $('s-code').textContent = code;

    state.timer = B.makeTimer(140, 9, 'calc(var(--u) * 1.5)');
    $('s-timer').appendChild(state.timer);

    new B.Poller({
      intervalMs: 2000,
      // The projector never sleeps: round expiry and debate turns advance when
      // somebody reads the battle, so this page is part of the clock.
      pauseWhenHidden: false,
      fetchOnce: function (version) {
        return B.request('GET', '/battle/' + code + '/screen?v=' + version);
      },
      onData: paint,
      onError: function (error, failures) {
        $('s-status').textContent = failures > 2 ? 'Reconnecting…' : 'Live';
      }
    }).start();

    (function frame() {
      var data = state.data;
      var live = data && data.round && data.round.status === 'running' && !data.battle.paused;

      if (live) {
        var left = B.renderTimer(state.timer, data.round.endsAt,
          (new Date(data.round.endsAt) - new Date(data.round.startedAt)) || 0);
        finalThirty(left > 0 && left <= 30000);
      } else {
        B.renderTimer(state.timer, null);
        finalThirty(false);
      }
      requestAnimationFrame(frame);
    })();
  }

  function paint(data) {
    state.data = data;

    $('s-title').textContent = data.battle.title;
    $('s-code').textContent = data.battle.code;

    var round = data.round;
    $('s-round').textContent = data.battle.status === 'finished' ? 'Final result'
      : data.battle.paused ? 'Paused'
      : round ? round.label : 'Lobby';

    $('s-status').textContent = data.counts.online + ' of ' + data.counts.joined + ' online';
    $('s-announce').textContent = data.battle.announcement ? data.battle.announcement.text : '';

    // Leaderboard
    var board = data.leaderboard || [];
    $('s-lb-note').textContent = board.length ? 'top ' + board.length : '';
    $('s-board').innerHTML = board.map(function (row) {
      return '<div class="brow">' +
        '<span class="brank">' + row.rank + '</span>' +
        '<div class="av c' + (row.colorIdx % 12) + '">' + esc(B.initials(row.displayName)) + '</div>' +
        '<span class="bname">' + esc(row.displayName) +
          (row.streak >= 2 ? ' <span class="streak">' + row.streak + '&#215;</span>' : '') +
        '</span>' +
        '<span class="bpts">' + row.total + '</span></div>';
    }).join('') || '<div class="center-note"><p class="faint">Nobody has scored yet.</p></div>';

    announceRankChanges(board);

    // Right column: the debate spotlight during round 2, the pulse grid otherwise.
    if (data.debateBoard) paintTeams(data.debateBoard);
    else paintPulse(data);

    celebrate(data.celebrations || []);
    cue(data.battle.soundCue);
  }

  function paintPulse(data) {
    $('s-right-title').textContent = data.battle.currentRound ? 'Who has submitted' : 'In the arena';
    $('s-submitted').textContent = data.battle.currentRound
      ? data.counts.submitted + ' / ' + data.counts.total
      : data.counts.joined + ' joined';

    $('s-right').innerHTML = '<div class="pulse">' + (data.pulse || []).map(function (p) {
      return '<div class="tile ' + p.state + (p.online ? '' : ' offline') + '">' +
        '<div class="av c' + (p.colorIdx % 12) + '">' + esc(B.initials(p.displayName)) + '</div>' +
        '<span>' + esc(p.displayName) + '</span></div>';
    }).join('') + '</div>' ||
      '<div class="center-note"><p class="faint">Waiting for students to join.</p></div>';
  }

  /**
   * ROUND 2 ON THE PROJECTOR, every team at once.
   *
   * Message counts are safe to show live: they tell the room who is engaged
   * without telling anybody who is winning. The best-team vote appears only
   * after the transcripts open, which is when it exists.
   */
  function paintTeams(board) {
    $('s-right-title').textContent = 'The debates';
    $('s-submitted').textContent = board.chatsOpen ? 'transcripts open' : board.teams.length + ' teams';

    $('s-right').innerHTML =
      '<div class="teamgrid">' + board.teams.map(function (t) {
        return '<div class="teamcard' + (t.status === 'live' ? ' live' : '') + '">' +
          '<div class="teamcard-top">' +
            '<b>' + esc(t.name) + '</b>' +
            '<span>' + t.messages + (t.votes ? ' · ' + t.votes + '&#9733;' : '') + '</span>' +
          '</div>' +
          '<p class="teamcard-topic">' + esc(t.topic || '') + '</p>' +
          '<div class="teamcard-mates">' + t.members.map(function (m) {
            return '<span class="mate ' + esc(m.side) + '">' + esc(m.name.split(' ')[0]) +
              (m.msgCount ? ' ' + m.msgCount : '') + '</span>';
          }).join('') + '</div>' +
        '</div>';
      }).join('') + '</div>' +
      (board.lastMessage
        ? '<p class="spot-quote" style="margin-top:calc(var(--u)*.7)">' +
          esc(board.lastMessage.text) +
          '<br><span class="faint mono" style="font-size:calc(var(--u)*.52)">, ' +
          esc(board.lastMessage.authorName) + ', ' + esc(board.lastMessage.teamName) +
          ' (' + esc(board.lastMessage.side) + ')</span></p>'
        : '');
  }

  /**
   * RANK CHANGES.
   *
   * Computed here by diffing the previous leaderboard against the new one, no
   * server state, because the projector already receives both and the answer is
   * only interesting for the two seconds it is on screen.
   *
   * Only overtakes INTO the top eight are announced. "Aarav overtook Zoya for
   * 3rd" is a moment; "Aarav overtook Zoya for 27th" is noise.
   */
  function announceRankChanges(board) {
    var now = {};
    board.forEach(function (row) { now[row.id] = row; });

    if (state.lastBoard) {
      board.forEach(function (row) {
        var was = state.lastBoard[row.id];
        if (!was || row.rank >= was.rank || row.rank > 8) return;

        // Who they went past, whoever now sits directly below them and used
        // to be above.
        var passed = board.filter(function (o) {
          var oWas = state.lastBoard[o.id];
          return oWas && o.rank > row.rank && oWas.rank < was.rank;
        })[0];

        tick(passed
          ? '<b>' + esc(row.displayName) + '</b> overtook ' + esc(passed.displayName) +
            ' for ' + ordinal(row.rank)
          : '<b>' + esc(row.displayName) + '</b> is now ' + ordinal(row.rank));
      });

      // Streak milestones, announced once, when they are reached.
      board.forEach(function (row) {
        var was = state.lastBoard[row.id];
        if (!was) return;
        if (row.streak >= 3 && row.streak > was.streak) {
          tick('<b>' + esc(row.displayName) + '</b>, ' + row.streak + ' in a row!');
        }
      });
    }

    state.lastBoard = now;
  }

  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function tick(html) {
    var host = document.getElementById('ticker');
    var el = document.createElement('div');
    el.className = 'tick-item';
    el.innerHTML = html;
    host.appendChild(el);
    setTimeout(function () { el.remove(); }, 4100);
    B.playCue('turn');
  }

  /**
   * The final thirty seconds get a pulsing red edge on the projector. It is the
   * one cue the whole room reacts to at once, which is exactly the point.
   */
  function finalThirty(on) {
    var el = document.getElementById('final30');
    el.classList.toggle('hidden', !on);
  }
})();
</script>
</body>
</html>
