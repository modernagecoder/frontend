  }

  /* -------------------------------------------------------- debate tab --- */

  /**
   * ROUND 2 — THE TEAMS TAB.
   *
   * Form the teams, adjust who argues which side, read what was said, score each
   * student individually, and download the lot.
   *
   * Per-student scoring rather than per-team because four students never
   * contribute equally, and marking them as a block punishes whoever did the
   * work. The message counts on each row are there to make that judgement
   * possible at a glance before you read a word.
   */
  function paintDebate() {
    var b = app.data.battle;
    var teams = (b.round2 && b.round2.teams) || [];
    var topics = ((b.rounds || []).filter(function (r) { return r.index === 2; })[0] || {}).questions || [];
    var votes = app.data.teamVotes || {};
    var open = !!(b.round2 && b.round2.chatsOpen);

    var sizes = teams.map(function (t) { return t.members.length; });

    $('tabbody').innerHTML =
      '<div class="item between" style="margin-bottom:1rem">' +
        '<div class="grow" style="min-width:0">' +
          '<strong style="font-size:.95rem">' +
            (teams.length ? teams.length + ' teams · ' + sizes.join(', ') : 'No teams yet') + '</strong>' +
          '<p class="faint" style="font-size:.8rem;margin-top:.2rem">' +
            (teams.length
              ? 'Students debate in their own team only. Every transcript opens to everyone when the round ends.'
              : 'Four per team, with the remainder as teams of five. Write a topic first.') +
          '</p>' +
        '</div>' +
        '<div class="row wrap">' +
          (teams.length ? '<button class="btn btn-sm btn-ghost" id="t-download">Download all chats</button>' : '') +
          (teams.length && !open ? '<button class="btn btn-sm btn-ghost" id="t-open">Open transcripts</button>' : '') +
          '<button class="btn btn-sm btn-primary" id="t-form">' +
            (teams.length ? 'Re-form teams' : 'Form teams') + '</button>' +
        '</div>' +
      '</div>' +

      (open ? '<div class="banner banner-success" style="margin-bottom:1rem">' +
        'Transcripts are open — students can read every team and vote for the best.</div>' : '') +

      (teams.length ? teams.map(function (t) {
        var topic = topics.filter(function (x) { return x.qid === t.topicQid; })[0];
        var total = t.members.reduce(function (n, m) { return n + (m.msgCount || 0); }, 0);

        return '<div class="card" style="margin-bottom:.9rem">' +
          '<div class="between" style="margin-bottom:.7rem">' +
            '<div class="grow" style="min-width:0">' +
              '<p class="kicker">' + esc(t.name) + '</p>' +
              '<h3 style="font-size:1rem;margin-top:.25rem;line-height:1.4">' +
                esc(topic ? (topic.topic || topic.title) : 'No topic set') + '</h3>' +
            '</div>' +
            '<div class="row">' +
              '<span class="pill ' + (t.status === 'live' ? 'pill-live' :
                t.status === 'done' ? 'pill-correct' : 'pill-wait') + '">' + esc(t.status) + '</span>' +
              '<span class="pill">' + total + ' messages</span>' +
              (votes[t.teamId] ? '<span class="pill pill-gold">' + votes[t.teamId] + ' votes</span>' : '') +
            '</div>' +
          '</div>' +

          '<div class="tbl-wrap"><table><thead><tr>' +
            '<th>Student</th><th>Side</th><th>Messages</th><th>Auto</th>' +
            '<th>Your mark / ' + b.config.r2QualityMax + '</th></tr></thead><tbody>' +
          t.members.map(function (m) {
            var auto = Math.min(m.msgCount || 0, b.config.r2MaxScoredMessages) * b.config.r2PointsPerMessage;
            return '<tr>' +
              '<td>' + esc(m.name) + '</td>' +
              '<td><select class="field" data-side="' + t.teamId + ':' + m.p + '" ' +
                  'style="padding:.28rem .4rem;font-size:.8rem;width:6rem">' +
                ['for', 'against'].map(function (s) {
                  return '<option value="' + s + '"' + (m.side === s ? ' selected' : '') + '>' + s + '</option>';
                }).join('') + '</select></td>' +
              '<td class="mono faint">' + (m.msgCount || 0) + '</td>' +
              '<td class="mono" style="color:var(--cyan-hi)">' + auto + '</td>' +
              '<td><input class="field" type="number" min="0" max="' + b.config.r2QualityMax + '" ' +
                'value="' + (m.quality || 0) + '" data-q="' + t.teamId + ':' + m.p + '" ' +
                'style="width:4.6rem;padding:.28rem .4rem;font-size:.82rem;text-align:center"></td>' +
            '</tr>';
          }).join('') + '</tbody></table></div>' +

          '<div class="row wrap" style="margin-top:.8rem">' +
            '<input class="field grow" data-note="' + t.teamId + '" placeholder="Your note on this debate" ' +
              'value="' + esc(t.note || '') + '" style="font-size:.84rem">' +
            '<button class="btn btn-sm btn-ghost" data-read="' + t.teamId + '">Read the debate</button>' +
            '<button class="btn btn-sm btn-primary" data-save="' + t.teamId + '">Save marks</button>' +
          '</div></div>';
      }).join('')
        : '<div class="card" style="text-align:center"><p class="mut">' +
          'Write a debate topic in Questions, then form the teams.</p></div>');

    bind('t-form', formTeams);
    bind('t-download', function () {
      downloadAuthed('/' + app.battleId + '/round2/transcript.txt',
        'battle-' + app.data.battle.code + '-debates.txt', 'All debates downloaded');
    });
    bind('t-open', function () {
      areYouSure('Open every transcript to every student now, before the round ends?',
        'Open transcripts').then(function (yes) {
          if (yes) act(api('POST', '/' + app.battleId + '/round2/open-chats'), 'Transcripts opened');
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-save]'), function (el) {
      el.addEventListener('click', function () { saveTeamMarks(el.dataset.save); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-read]'), function (el) {
      el.addEventListener('click', function () { readDebate(el.dataset.read); });
    });
  }

  function formTeams() {
    var running = app.data.battle.currentRound === 2;
    var ask = running
      ? areYouSure('Round 2 is running. Re-forming teams deletes every debate written so far.',
          'Re-form anyway', true)
      : Promise.resolve(true);

    ask.then(function (yes) {
      if (!yes) return;
      act(api('POST', '/' + app.battleId + '/round2/form-teams', { force: running }))
        .then(function (res) {
          toast(res.teams.length + ' teams formed — ' + res.sizes.join(', '), 'success');
        });
    });
  }

  function saveTeamMarks(teamId) {
    var scores = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-q^="' + teamId + ':"]'), function (el) {
      scores[el.dataset.q.split(':')[1]] = Number(el.value) || 0;
    });

    var sides = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-side^="' + teamId + ':"]'), function (el) {
      sides[el.dataset.side.split(':')[1]] = el.value;
    });

    var noteEl = document.querySelector('[data-note="' + teamId + '"]');
    var note = noteEl ? noteEl.value : '';

    // Sides first, then the marks, so a side change is reflected in the
    // transcript header before the scores land.
    api('PUT', '/' + app.battleId + '/round2/teams/' + teamId, { sides: sides })
      .then(function () {
        return act(api('POST', '/' + app.battleId + '/round2/teams/' + teamId + '/score',
          { scores: scores, note: note }), 'Marks saved');
      })
      .catch(function (error) { toast(error.message, 'error'); });
  }

  /**
   * Reads one team's transcript in a modal. Fetched from the full download and
   * sliced client-side rather than adding a per-team endpoint — the host is
   * about to download the whole thing anyway.
   */
  function readDebate(teamId) {
    var team = ((app.data.battle.round2 || {}).teams || [])
      .filter(function (t) { return t.teamId === teamId; })[0];

    openModal('<h2 style="font-size:1.15rem;margin-bottom:.8rem">' +
      esc(team ? team.name : 'Debate') + '</h2>' +
      '<div id="rd-body"><div class="row"><div class="spinner"></div>' +
      '<span class="faint" style="font-size:.85rem">Loading the transcript…</span></div></div>' +
      '<div class="row" style="margin-top:1rem;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="rd-close">Close</button></div>');

    bind('rd-close', closeModal);

    fetch(B.API_BASE + '/battle-admin/' + app.battleId + '/round2/transcript.txt', {
      headers: { Authorization: 'Bearer ' + app.token }
    }).then(function (r) { return r.text(); }).then(function (txt) {
      var name = (team ? team.name : '').toUpperCase();
      var from = txt.indexOf(name);
      var chunk = from < 0 ? txt : txt.slice(from);
      // Stop at the next team's banner.
      var nextBar = chunk.indexOf('='.repeat(78), 10);
      if (nextBar > 0) chunk = chunk.slice(0, nextBar);

      var body = document.getElementById('rd-body');
      if (body) body.innerHTML = '<pre class="qbody" style="max-height:60vh">' + esc(chunk.trim()) + '</pre>';
    }).catch(function () {
      var body = document.getElementById('rd-body');
      if (body) body.innerHTML = '<div class="banner banner-error">Could not load the transcript.</div>';
    });
  }


  function paintBoard() {
    var board = app.data.leaderboard || [];

    $('tabbody').innerHTML = '<div class="card">' +
      '<div class="between" style="margin-bottom:1rem">' +
        '<p class="kicker">Live standings</p>' +
        '<button class="btn btn-sm" id="b-csv">Download CSV</button></div>' +
      '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>#</th><th></th><th>Name</th><th>R1</th><th>R2</th><th>R3</th><th>Total</th><th></th>' +
      '</tr></thead><tbody>' +
      board.map(function (row) {
        return '<tr><td class="mono" style="color:' + (row.rank === 1 ? 'var(--gold)' : 'var(--faint)') +
            ';font-weight:700">' + row.rank + '</td>' +
          '<td><div class="av c' + (row.colorIdx % 12) + '">' + esc(B.initials(row.displayName)) + '</div></td>' +
          '<td>' + esc(row.displayName) + '</td>' +
          '<td class="mono faint">' + row.r1 + '</td>' +
          '<td class="mono faint">' + row.r2 + '</td>' +
          '<td class="mono faint">' + row.r3 + '</td>' +
          '<td class="mono" style="color:var(--cyan-hi);font-weight:700">' + row.total + '</td>' +
          '<td><button class="btn btn-sm btn-ghost" data-cert="' + row.id + '">Certificate</button></td></tr>';
      }).join('') + '</tbody></table></div></div>';

    bind('b-csv', downloadCsv);

    Array.prototype.forEach.call(document.querySelectorAll('[data-cert]'), function (el) {
      el.addEventListener('click', function () {
        certificate(board.filter(function (r) { return r.id === el.dataset.cert; })[0]);
      });
    });
  }

  /**
   * WINNER CERTIFICATE.
   *
   * Rendered in a new window and handed straight to the browser's print dialog,
   * where "Save as PDF" is one click away. Nothing is generated server-side and
   * nothing is stored — there is no file storage configured on this project, and
   * a certificate is a view of data that already exists rather than an artefact
   * worth keeping.
   */
  function certificate(row) {
    if (!row) return;
    var b = app.data.battle;
    var when = new Date(b.finalizedAt || Date.now()).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
    var placing = row.rank === 1 ? 'First place'
      : row.rank === 2 ? 'Second place'
      : row.rank === 3 ? 'Third place'
      : 'Rank ' + row.rank;

    var win = window.open('', '_blank');
    if (!win) return toast('Allow pop-ups to print certificates.', 'warn');

    win.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<title>Certificate — ' + esc(row.displayName) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600&display=swap" rel="stylesheet">' +
      '<style>' +
        '@page { size: A4 landscape; margin: 0 }' +
        '*{margin:0;padding:0;box-sizing:border-box}' +
        'body{font-family:Sora,sans-serif;background:#07030f;color:#f4f0ff;' +
          'width:297mm;height:210mm;display:grid;place-items:center;' +
          '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
        '.sheet{width:100%;height:100%;padding:18mm;display:flex;flex-direction:column;' +
          'align-items:center;justify-content:center;text-align:center;position:relative;' +
          'background:radial-gradient(60% 50% at 15% 8%,rgba(168,85,247,.22),transparent 60%),' +
          'radial-gradient(55% 45% at 85% 6%,rgba(45,212,191,.16),transparent 60%),' +
          'radial-gradient(70% 60% at 50% 115%,rgba(255,45,142,.12),transparent 60%),#07030f}' +
        '.frame{position:absolute;inset:10mm;border:1px solid rgba(168,133,247,.32);border-radius:6mm}' +
        '.kick{font-family:"JetBrains Mono",monospace;font-size:9pt;letter-spacing:.32em;' +
          'text-transform:uppercase;color:#5eead4;margin-bottom:6mm}' +
        '.place{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20pt;' +
          'color:#ffd24a;letter-spacing:.02em;margin-bottom:3mm}' +
        'h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:46pt;' +
          'line-height:1.05;margin-bottom:5mm;' +
          'background:linear-gradient(102deg,#a855f7,#2dd4bf 50%,#c4f82a);' +
          '-webkit-background-clip:text;background-clip:text;color:transparent}' +
        '.for{font-size:11pt;color:#b6a9d6;margin-bottom:8mm;max-width:170mm;line-height:1.7}' +
        '.score{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16pt;' +
          'color:#5eead4;margin-bottom:10mm}' +
        '.foot{display:flex;gap:14mm;font-family:"JetBrains Mono",monospace;font-size:8.5pt;' +
          'color:#7c6da3;letter-spacing:.14em;text-transform:uppercase}' +
        '.org{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11pt;' +
          'color:#f4f0ff;margin-top:9mm}' +
        '.org em{font-style:normal;color:#c4f82a}' +
        '@media print{ body{background:#07030f} }' +
      '</style></head><body><div class="sheet"><div class="frame"></div>' +
        '<div class="kick">Certificate of Achievement</div>' +
        '<div class="place">' + esc(placing) + '</div>' +
        '<h1>' + esc(row.displayName) + '</h1>' +
        '<p class="for">competed in <strong>' + esc(b.title) + '</strong>, a live three-round coding battle ' +
          'covering programming, structured debate and building with AI tools.</p>' +
        '<div class="score">' + row.total + ' points &nbsp;·&nbsp; Round 1: ' + row.r1 +
          ' &nbsp;·&nbsp; Round 2: ' + row.r2 + ' &nbsp;·&nbsp; Round 3: ' + row.r3 + '</div>' +
        '<div class="foot"><span>' + esc(when) + '</span><span>Battle ' + esc(b.code) + '</span></div>' +
        '<div class="org">Modern Age <em>Coders</em></div>' +
      '</div>' +
      /**
       * EVERY CLOSING TAG IN THIS STRING IS WRITTEN AS <\/tag>, AND MUST STAY
       * THAT WAY — including in comments, because an HTML parser does not know
       * what a JavaScript comment is.
       *
       * Two separate things bite here. A bare closing script tag ends this
       * page's own script block. A bare closing body tag is subtler:
       * scripts/dev-server.js injects a bootstrap snippet before the first one
       * it finds in the file, so a literal one inside this string gets a script
       * tag spliced into the middle of it and the console breaks locally while
       * looking perfectly fine on disk.
       *
       * The backslash makes the raw bytes match neither the HTML parser nor
       * that regex, while JavaScript still yields the correct tag.
       */
      '<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script>' +
      '<\/body><\/html>'
    );
    win.document.close();
  }

  function downloadCsv() {
    downloadAuthed('/' + app.battleId + '/export.csv',
      'battle-' + app.data.battle.code + '-results.csv', 'Results downloaded');
  }

  /* -------------------------------------------------------------- modal -- */

  function openModal(html) {
    $('modal-host').innerHTML = '<div class="modal-back" id="modal-back">' +
      '<div class="card modal">' + html + '</div></div>';
    $('modal-back').addEventListener('click', function (event) {
      if (event.target.id === 'modal-back') closeModal();
    });
  }
  function closeModal() { $('modal-host').innerHTML = ''; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  /**
   * In-page replacements for prompt() and confirm().
   *
   * Native browser dialogs block the whole page — including the sync loop that
   * is keeping the round clock running — and cannot be styled or dismissed by
   * anything except the person standing at the laptop. In a live exam that is
   * exactly wrong.
   */
  function ask(opts) {
    return new Promise(function (resolve) {
      openModal(
        '<h2 style="font-size:1.15rem;margin-bottom:.3rem">' + esc(opts.title) + '</h2>' +
        (opts.hint ? '<p class="faint" style="font-size:.82rem;margin-bottom:.9rem">' +
          esc(opts.hint) + '</p>' : '') +
        '<div class="stack">' + (opts.fields || []).map(function (f) {
          return '<div><label class="lbl" for="ask-' + f.name + '">' + esc(f.label) + '</label>' +
            '<input class="field" id="ask-' + f.name + '" type="' + (f.type || 'text') + '" ' +
              'value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '"></div>';
        }).join('') + '</div>' +
        '<div class="row" style="margin-top:1.1rem;justify-content:flex-end">' +
          '<button class="btn btn-ghost" id="ask-no">Cancel</button>' +
          '<button class="btn btn-primary" id="ask-yes">' + esc(opts.confirm || 'Save') + '</button></div>');

      var first = document.querySelector('.modal .field');
      if (first) { first.focus(); first.select(); }

      function submit() {
        var out = {};
        (opts.fields || []).forEach(function (f) { out[f.name] = $('ask-' + f.name).value; });
        closeModal();
        resolve(out);
      }

      bind('ask-yes', submit);
      bind('ask-no', function () { closeModal(); resolve(null); });

      Array.prototype.forEach.call(document.querySelectorAll('.modal .field'), function (el) {
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      });
    });
  }

  function areYouSure(message, confirmLabel, danger) {
    return new Promise(function (resolve) {
      openModal(
        '<h2 style="font-size:1.15rem;margin-bottom:.7rem">Are you sure?</h2>' +
        '<p class="mut" style="font-size:.92rem;line-height:1.6">' + esc(message) + '</p>' +
        '<div class="row" style="margin-top:1.2rem;justify-content:flex-end">' +
          '<button class="btn btn-ghost" id="sure-no">Cancel</button>' +
          '<button class="btn ' + (danger ? 'btn-wrong' : 'btn-primary') + '" id="sure-yes">' +
            esc(confirmLabel) + '</button></div>');

      bind('sure-yes', function () { closeModal(); resolve(true); });
      bind('sure-no', function () { closeModal(); resolve(false); });
    });
  }

  /* -------------------------------------------------------------- clock -- */

  function startClock() {
    (function frame() {
      var d = app.data;
      var round = d && (d.battle.rounds || []).filter(function (r) {
        return r.index === d.battle.currentRound;
      })[0];

      if (round && round.status === 'running' && !d.battle.pausedAt) {
        B.renderTimer(app.timerEl, round.endsAt, (round.durationSec || 0) * 1000);
      } else {
        B.renderTimer(app.timerEl, null);
      }
      requestAnimationFrame(frame);
    })();
  }
})();
</script>
</body>
</html>
