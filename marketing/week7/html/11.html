<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.man{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.pair{display:flex;align-items:baseline;gap:26px;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;line-height:.8}
.pair .six{font-size:200px;color:var(--pine)}
.pair .to{font-size:80px;color:#3b3833;letter-spacing:-2px}
.pair .sev{font-size:200px;color:var(--coral);position:relative}
.pair .sev .circ{position:absolute;inset:-26px -30px;border:5px solid var(--coral);border-radius:50%;transform:rotate(-6deg)}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:48px;color:var(--pine);transform:rotate(-2deg)}
.sub{max-width:760px;text-align:center}
h1{font-size:64px;letter-spacing:-1.5px}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// the range</span></div>
  <div class="main"><div class="fit">
   <div class="man">
      <span class="aud k">For everyone</span>
      <h1>Our classes run, ages</h1>
      <div class="pair"><span class="six">6</span><span class="to">to</span><span class="sev">67<span class="circ"></span></span></div>
      <div class="note">the 67 is doing exactly what you think it is</div>
      <div class="sub">Six year olds starting early. Sixty-somethings finally getting to it. The middle of that range has no excuse left.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Find your batch</span></div>
</div></body></html>
