<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:20px}
h1{font-size:84px}
.cmp{display:flex;flex-direction:column;gap:14px;max-width:880px}
.chip{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:14px;padding:15px 20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:29px;box-shadow:4px 4px 0 var(--ink)}
.chip .t{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;letter-spacing:1px;padding:5px 10px;border-radius:8px;flex:none}
.chip.no{background:#fff;color:#8a8478}.chip.no .t{background:#EFE7D5;color:#8a8478}
.chip.yes{background:#EAF2EE}.chip.yes .t{background:var(--pine);color:#fff}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:42px;color:var(--coral);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// interview prep</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="aud">For college students</span>
    <h1>Interviews ask<br>DSA. Tutorials<br>skip the <span class="coral">why</span>.</h1>
    <div class="cmp">
      <div class="chip no"><span class="t">CRAM</span> Memorise 200 LeetCode solutions</div>
      <div class="chip yes"><span class="t">LEARN</span> Master 10 patterns that solve them all</div>
    </div>
    <div class="note">arrays to graphs, taught properly</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Learn the patterns</span></div>
</div></body></html>
