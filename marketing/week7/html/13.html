<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:22px}
h1{font-size:84px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px}
.st{border:3px solid var(--ink);border-radius:16px;background:var(--card);padding:18px 22px;box-shadow:5px 6px 0 var(--ink)}
.st .k{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;line-height:1;color:var(--coral)}
.st.p .k{color:var(--pine)}.st.a .k{color:var(--amber)}.st.i .k{color:var(--ink)}
.st .v{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:20px;color:#3b3833;margin-top:8px;line-height:1.3}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:42px;color:var(--pine);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// receipts</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="aud k">For everyone</span>
    <h1>Numbers we did<br><span class="hl">not</span> make up.</h1>
    <div class="stats">
      <div class="st"><div class="k">10,000+</div><div class="v">students taught</div></div>
      <div class="st p"><div class="k">4.9</div><div class="v">rated across 547 Google reviews</div></div>
      <div class="st a"><div class="k">25+</div><div class="v">countries, live online</div></div>
      <div class="st i"><div class="k">2020</div><div class="v">teaching since</div></div>
    </div>
    <div class="note">the reviews are the fun part, go read them</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Join them</span></div>
</div></body></html>
