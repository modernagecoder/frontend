<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.hero{display:flex;align-items:center;gap:30px}
.txt{flex:1.08;display:flex;flex-direction:column;gap:18px}
.art{flex:.92;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-size:78px}
.ladder{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.step{display:flex;align-items:center;gap:14px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:29px}
.step .n{width:44px;height:44px;flex:none;border-radius:12px;border:3px solid var(--ink);background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:3px 3px 0 var(--ink)}
.step .n.b{background:#BFE0D2}.step .n.c{background:#F3B7A6}
.illo-card{width:100%}
.illo-card img{width:100%;height:auto;display:block}
.scribble{font-family:'Caveat',cursive;font-weight:700;font-size:38px;color:var(--pine);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// gently does it</span></div>
  <div class="main"><div class="fit">
   <div class="hero">
    <div class="txt">
      <span class="aud a">For kids &middot; 6 to 12</span>
      <h1>From blocks<br>to Python,<br><span class="hlp">gently</span>.</h1>
      <div class="ladder">
        <div class="step"><span class="n">1</span> Drag-and-drop logic that feels like play</div>
        <div class="step"><span class="n b">2</span> First typed code, tiny wins daily</div>
        <div class="step"><span class="n c">3</span> Python projects they show off</div>
      </div>
      <div class="cta" style="margin-top:8px">See the kids path <span class="arw">&rarr;</span></div>
    </div>
    <div class="art">
      <div class="illo-card"><img src="art/thinking.svg" alt=""></div>
      <div class="scribble">no rushing, no boredom</div>
    </div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Free demo class</span></div>
</div></body></html>
