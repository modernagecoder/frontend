<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:18px}
h1{font-size:64px}
.btns{display:flex;gap:20px;align-items:stretch;max-width:940px}
.b{flex:1;border:3px solid var(--ink);border-radius:20px;padding:26px 24px;box-shadow:7px 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.b .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;letter-spacing:2px;color:#8a8478}
.b .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1.03;letter-spacing:-1px}
.b.one{background:#F5F1E6}
.b.two{background:#FBE6DE;box-shadow:7px 8px 0 var(--coral)}
.b.two .t{color:var(--coral2)}
.hand{display:flex;align-items:center;gap:16px;margin-top:2px}
.hand .il{width:190px;flex:none}
.hand .il img{width:100%;height:auto;display:block}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// hard choice</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="meme-tag">Two buttons</span>
    <h1>Every learner,<br>every single <span class="hl">evening</span>.</h1>
    <div class="btns">
      <div class="b one"><span class="n">BUTTON 1</span><span class="t">Watch one more tutorial</span></div>
      <div class="b two"><span class="n">BUTTON 2</span><span class="t">Actually build something</span></div>
    </div>
    <div class="hand">
      <div class="il"><img src="art/thinking.svg" alt=""></div>
      <div class="punch">we press button two for you. twice a week. live.</div>
    </div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Press button two</span></div>
</div></body></html>
