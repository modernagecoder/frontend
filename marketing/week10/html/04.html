<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:16px}
.said{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;letter-spacing:-1px;line-height:1.05}
.said .m{color:var(--coral)}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;letter-spacing:-1px;margin-top:4px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:8px 9px 0 var(--ink);overflow:hidden;max-width:880px}
.card .bar{background:#F0EDE4;border-bottom:3px solid var(--ink);padding:12px 18px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:#6b6259}
.card .bd{padding:18px 22px;display:flex;align-items:center;gap:20px}
.thumb{width:150px;height:92px;flex:none;background:#211F24;border:3px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center}
.thumb .tri{width:0;height:0;border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:6px}
.meta .ti{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.1}
.meta .sub2{font-family:'JetBrains Mono',monospace;font-size:19px;color:#8a8478;margin-top:8px;line-height:1.5}
.prog{height:12px;background:#EFE7D5;border:2.5px solid var(--ink);border-radius:99px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:3%;background:var(--coral)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// at home</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <div class="said"><span class="m">Mom:</span> we have coding<br>classes at home.</div>
    <div class="label">Coding classes at home:</div>
    <div class="card">
      <div class="bar">MY PLAYLIST &middot; saved 8 months ago</div>
      <div class="bd">
        <div class="thumb"><span class="tri"></span></div>
        <div class="meta">
          <div class="ti">Learn Python in 10 Hours</div>
          <div class="sub2">watched: 4 minutes<br>last opened: never again</div>
          <div class="prog"><i></i></div>
        </div>
      </div>
    </div>
    <div class="punch p">ours has a human who notices when you stop.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Live, not saved</span></div>
</div></body></html>
