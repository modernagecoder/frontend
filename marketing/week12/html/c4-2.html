<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="carousel.css">
<style>
.wrap{display:flex;flex-direction:column;gap:16px}
.throw{display:flex;flex-direction:column;gap:11px}
.tr{display:flex;align-items:center;gap:16px;border:3px solid var(--ink);border-radius:14px;padding:12px 18px;box-shadow:4px 5px 0 var(--ink)}
.tr .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;width:84px;flex:none;color:#8a8478}
.tr .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;flex:1;line-height:1.1}
.tr .m{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;flex:none}
.t1{background:#FBE6DE}.t1 .m{color:var(--coral2)}
.t2{background:#FBF0D8}.t2 .m{color:#8a5a10}
.t3{background:#F3F6F0}.t3 .m{color:#5a7a3a}
.t4{background:#EAF2EE}.t4 .m{color:var(--pine)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="sn">2/6</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="step">You have already done this</span>
    <h2>Throwing paper<br>into a bin.</h2>
    <div class="throw">
      <div class="tr t1"><span class="n">throw 1</span><span class="t">Way too hard</span><span class="m">off by 40cm</span></div>
      <div class="tr t2"><span class="n">throw 2</span><span class="t">Softer, still long</span><span class="m">off by 15cm</span></div>
      <div class="tr t3"><span class="n">throw 3</span><span class="t">Tiny bit less</span><span class="m">off by 4cm</span></div>
      <div class="tr t4"><span class="n">throw 4</span><span class="t">In.</span><span class="m">off by 0</span></div>
    </div>
    <div class="hand p">nobody taught you the physics. you adjusted from the error, four times.</div>
   </div>
  </div></div>
  <div class="swipe">swipe <span class="ar">&rarr;</span></div>
</div></body></html>
