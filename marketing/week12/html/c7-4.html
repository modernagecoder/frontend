<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="carousel.css">
<style>
.wrap{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.bits{display:flex;gap:12px}
.bt{width:124px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;text-align:center;box-shadow:5px 6px 0 var(--ink)}
.bt .val{padding:8px 0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;background:#F0EDE4;border-bottom:3px solid var(--ink);color:#5a544a}
.bt .b{padding:18px 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:48px}
.bt.on .b{background:var(--yellow)}
.bt.off .b{background:#fff;color:#c9c2b4}
.qbox{border:4px dashed var(--coral);border-radius:18px;padding:20px 26px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;color:var(--coral2);letter-spacing:-1px}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="sn">4/6</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="step a">Your turn. No calculator.</span>
    <h2>What number<br>is this?</h2>
    <div class="bits">
      <div class="bt on"><div class="val">8</div><div class="b">1</div></div>
      <div class="bt on"><div class="val">4</div><div class="b">1</div></div>
      <div class="bt off"><div class="val">2</div><div class="b">0</div></div>
      <div class="bt on"><div class="val">1</div><div class="b">1</div></div>
    </div>
    <div class="qbox">Comment your answer</div>
    <div class="hand p">if you got it in under five seconds, you can read binary now. genuinely.</div>
   </div>
  </div></div>
  <div class="swipe">swipe <span class="ar">&rarr;</span></div>
</div></body></html>
