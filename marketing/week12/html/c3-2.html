<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="carousel.css">
<style>
.wrap{display:flex;flex-direction:column;gap:18px}
.house{display:flex;align-items:center;gap:20px;margin-top:4px}
.box{border:4px solid var(--ink);border-radius:18px;background:#FBF0D8;box-shadow:7px 8px 0 var(--ink);padding:20px 26px;text-align:center}
.box .lb{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;letter-spacing:2px;color:#8a5a10}
.box .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;margin-top:5px}
.tags{display:flex;flex-direction:column;gap:12px}
.tg{background:var(--ink);color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;padding:11px 20px;border-radius:12px;position:relative}
.tg::after{content:"";position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:22px;height:4px;background:var(--ink)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="sn">2/6</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="step">The analogy</span>
    <h2>You did not make<br>a photocopy.<br>You gave it a nickname.</h2>
    <div class="house">
      <div class="tags"><span class="tg">a</span><span class="tg">b</span></div>
      <div class="box"><div class="lb">ONE LIST IN MEMORY</div><div class="v">[1, 2, 3]</div></div>
    </div>
    <div class="body">Two names. <b>One</b> list. Writing through either name changes the same thing, because there was only ever one thing.</div>
   </div>
  </div></div>
  <div class="swipe">swipe <span class="ar">&rarr;</span></div>
</div></body></html>
