<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="carousel.css">
<style>
.wrap{display:flex;flex-direction:column;gap:16px}
.bits{display:flex;gap:10px;justify-content:flex-start}
.bt{width:112px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;text-align:center;box-shadow:4px 5px 0 var(--ink)}
.bt .val{padding:8px 0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;background:#F0EDE4;border-bottom:3px solid var(--ink);color:#5a544a}
.bt .b{padding:14px 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px}
.bt.on .b{background:var(--yellow)}
.bt.off .b{background:#fff;color:#c9c2b4}
.sum{background:var(--ink);color:#fff;border-radius:16px;padding:18px 24px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px}
.sum .y2{color:var(--yellow)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="sn">3/6</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="step">Every switch is worth double the last</span>
    <h2>Read it like coins.</h2>
    <div class="bits">
      <div class="bt on"><div class="val">worth 8</div><div class="b">1</div></div>
      <div class="bt off"><div class="val">worth 4</div><div class="b">0</div></div>
      <div class="bt on"><div class="val">worth 2</div><div class="b">1</div></div>
      <div class="bt on"><div class="val">worth 1</div><div class="b">1</div></div>
    </div>
    <div class="sum">1011 &nbsp;=&nbsp; 8 + 0 + 2 + 1 &nbsp;=&nbsp; <span class="y2">11</span></div>
    <div class="body">Switch on, add its coin. Switch off, add nothing. That is the entire conversion, forever.</div>
   </div>
  </div></div>
  <div class="swipe">swipe <span class="ar">&rarr;</span></div>
</div></body></html>
