<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="carousel.css">
<style>
.wrap{display:flex;flex-direction:column;gap:18px}
.sw{display:flex;gap:14px;justify-content:center;margin:6px 0}
.s{width:112px;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 6px 0 var(--ink);overflow:hidden;text-align:center}
.s .top{padding:16px 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;border-bottom:3px solid var(--ink)}
.s .bot{padding:9px 0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px}
.on .top{background:var(--yellow)}.on .bot{background:var(--ink);color:var(--yellow)}
.off .top{background:#EFEBE1;color:#b8b0a4}.off .bot{background:#F5F1E6;color:#8a8478}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="sn">2/6</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="step">Start here</span>
    <h2>A computer only<br>has light switches.</h2>
    <div class="body">Off or on. Nothing in between. No 3, no 7, no "maybe". So how does it hold the number 200?</div>
    <div class="sw">
      <div class="s off"><div class="top">OFF</div><div class="bot">0</div></div>
      <div class="s on"><div class="top">ON</div><div class="bot">1</div></div>
    </div>
    <div class="hand p">it does what you do with coins. it uses more of them.</div>
   </div>
  </div></div>
  <div class="swipe">swipe <span class="ar">&rarr;</span></div>
</div></body></html>
