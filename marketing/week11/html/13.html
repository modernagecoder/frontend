<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:16px}
h1{font-size:58px}
.dr{display:flex;align-items:stretch;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:7px 8px 0 var(--ink)}
.dr .mk{width:118px;flex:none;display:flex;align-items:center;justify-content:center;border-right:3px solid var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;color:#fff}
.dr .tx{flex:1;padding:22px 26px;display:flex;align-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:36px;line-height:1.08;letter-spacing:-1px}
.no .mk{background:var(--coral)}
.no{background:#FBE6DE}
.no .tx{color:#8a5b4d}
.yes .mk{background:var(--pine)}
.yes{background:#EAF2EE}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// hard pass</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="meme-tag">Hard no. Hard yes.</span>
    <h1>Same student.<br>Two very different <span class="hl">years</span>.</h1>
    <div class="dr no"><span class="mk">&#10007;</span><span class="tx">"I'll start once I have more free time"</span></div>
    <div class="dr yes"><span class="mk">&#10003;</span><span class="tx">One hour, twice a week, with a teacher waiting for you</span></div>
    <div class="punch p">free time never arrives. a scheduled class does.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Pick the green one</span></div>
</div></body></html>
