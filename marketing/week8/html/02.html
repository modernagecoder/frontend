<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:20px}
.panel{border:3px solid var(--ink);border-radius:18px;padding:22px 26px;box-shadow:6px 7px 0 var(--ink)}
.panel .lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.panel .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-1px}
.panel.one{background:#fff}.panel.one .lab{color:#8a8478}
.panel.two{background:#EAF2EE}.panel.two .lab{color:var(--pine)}
.eyebrow{font-size:50px}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:40px;color:var(--coral);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// how it goes</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <div class="eyebrow">how learning to code actually goes</div>
    <div class="panel one">
      <div class="lab">Day 1</div>
      <div class="big">print("hello world")<br>feels like magic. It is.</div>
    </div>
    <div class="panel two">
      <div class="lab">Day 30</div>
      <div class="big">Builds a calculator app.<br>Demands the family use it.</div>
    </div>
    <div class="note">day 1 is free, by the way</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Start day 1 free</span></div>
</div></body></html>
