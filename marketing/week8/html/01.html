<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:22px}
h1{font-size:92px}
.badge{display:inline-flex;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);padding:9px 18px;border-radius:10px;width:fit-content;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.win{width:100%;max-width:820px}
.win .body{font-size:30px;line-height:1.7}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:44px;color:var(--pine);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// pop quiz</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="badge">Pop quiz &middot; no running it</span>
    <h1>Crash or<br>no <span class="hl">crash</span>?</h1>
    <div class="win">
      <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span></div>
      <div class="body"><span class="cyn">print</span>(<span class="grn">"2"</span> + <span class="yel">2</span>)</div>
    </div>
    <div class="note">comment your answer. we reply to every guess.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Answer tomorrow</span></div>
</div></body></html>
