<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.panel{width:100%;max-width:880px;border:3px solid var(--ink);border-radius:18px;padding:24px 28px;box-shadow:6px 7px 0 var(--ink);text-align:left}
.panel .lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;letter-spacing:2px;margin-bottom:6px}
.panel .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:42px;line-height:1.05;letter-spacing:-1px}
.panel.one{background:#FBE6DE}.panel.one .lab{color:var(--coral)}
.panel.two{background:#EAF2EE}.panel.two .lab{color:var(--pine)}
h1{font-size:56px;letter-spacing:-1px}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:42px;color:var(--pine);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// the two moods</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <h1>The two moods of every programmer:</h1>
    <div class="panel one">
      <div class="lab">MOOD 1</div>
      <div class="big">"My code doesn't work.<br>I have no idea why."</div>
    </div>
    <div class="panel two">
      <div class="lab">MOOD 2</div>
      <div class="big">"My code works.<br>I have no idea why."</div>
    </div>
    <div class="note">our classes exist for both. you leave knowing why.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Know the why</span></div>
</div></body></html>
