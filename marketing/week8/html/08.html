<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.man{display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.big{font-family:'Caveat',cursive;font-weight:700;font-size:96px;line-height:1.04;color:var(--ink);transform:rotate(-1.5deg);max-width:900px}
.big .c{color:var(--coral)}
.arrowdown{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;color:var(--pine)}
.sub{max-width:700px;text-align:center}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// you know one</span></div>
  <div class="main"><div class="fit">
   <div class="man">
      <span class="kick">Public service announcement</span>
      <div class="big">Tag the friend who has said<br><span class="c">"I'll learn coding someday"</span><br>every single year since 2020.</div>
      <div class="arrowdown">&darr;</div>
      <div class="sub"><b>Someday has a date now.</b> The demo class is free and we teach ages 6 to 67, so their excuse pool is officially empty.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">Tag them</span></div>
</div></body></html>
