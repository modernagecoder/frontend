<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;flex-direction:column;gap:22px}
h1{font-size:80px}
.list{display:flex;flex-direction:column;gap:13px;max-width:860px}
.itm{display:flex;align-items:center;gap:16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:31px}
.itm .bx{width:44px;height:44px;flex:none;border:3px solid var(--ink);border-radius:10px;background:#EAF2EE;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--pine);box-shadow:3px 3px 0 var(--ink)}
.note{font-family:'Caveat',cursive;font-weight:700;font-size:44px;color:var(--coral);transform:rotate(-2deg)}
</style></head>
<body><div class="frame">
  <div class="brand-row"><span class="logo"><img src="art/logo.svg"></span><span class="brand-name">Modern Age Coders</span><span class="brand-tag">// checklist</span></div>
  <div class="main"><div class="fit">
   <div class="wrap">
    <span class="eyebrow">official readiness assessment</span>
    <h1>Are you ready<br>to learn <span class="hlp">coding</span>?</h1>
    <div class="list">
      <div class="itm"><span class="bx">&#10003;</span> You can google things</div>
      <div class="itm"><span class="bx">&#10003;</span> You like making stuff work</div>
      <div class="itm"><span class="bx">&#10003;</span> You are between 6 and 67</div>
      <div class="itm"><span class="bx">&#10003;</span> You read this whole checklist</div>
    </div>
    <div class="note">congratulations. that was the entire test.</div>
   </div>
  </div></div>
  <div class="foot"><span class="site">learn.modernagecoders.com</span><span class="pill">You passed. Start.</span></div>
</div></body></html>
